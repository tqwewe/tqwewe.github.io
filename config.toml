# The URL the site will be built for
base_url = "https://tqwewe.com"
title = "Ari Seyhun"
description = "Passionate developer whose ultimate goal is to make the world of development just a little better."
theme = "adidoks"
author = "Ari Seyhun"

# The default language; used in feeds and search index
# Note: the search index doesn't support Chinese/Japanese/Korean Languages
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# When set to "true", the generated HTML files are minified.
minify_html = false

# The taxonomies to be rendered for the site and their configuration.
taxonomies = []

# Whether to build a search index to be used later on by a JavaScript library
# When set to "true", a search index is built from the pages and section
# content for `default_language`.
build_search_index = true

generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]

[search]
# Whether to include the title of the page/section in the index
include_title = true
# Whether to include the description of the page/section in the index
include_description = false
# Whether to include the rendered content of the page/section in the index
include_content = true

[markdown.highlighting]
# Whether to do syntax highlighting.
# Theme can be customised by setting the `highlight_theme`
# variable to a theme supported by Zola
# highlight_code = true
theme = "github-dark"

# Zola bundles no definition for heklang, so `hek` blocks come from syntaxes/
extra_grammars = ["syntaxes/hek.tmLanguage.json"]

[extra]
# Put all your custom variables here
author = "Ari Seyhun"
git = "https://git.tqwewe.com/tqwewe"
twitter = ""
email = "hello@tqwewe.com"
ganalytics = "G-L19E24B8HH"          # Google Analytics code
mastodon = "https://social.tqwewe.com/@ari"

# If running on netlify.app site, set to true
is_netlify = false

# Set HTML file language
language_code = "en-US"

# Set theme-color meta tag for Chrome browser
theme_color = "#fff"

# More about site's title
title_separator = "|" # set as |, -, _, etc
title_addition = ""

# Set date format in blog publish metadata
timeformat = "%B %e, %Y" # e.g. 2021-05-01 09:19:42
timezone = "UTC"

## Math settings
# options: true, false. Enable math support globally,
# default: false. You can always enable math on a per page.
math = false
library = "katex" # options: "katex", "mathjax". default is "katex".

## Open Graph + Twitter Cards
[extra.open]
enable = false
# this image will be used as fallback if a page has no image of its own
# image = "doks.png"
# twitter_site = "aaranxu"
# twitter_creator = "aaranxu"
# facebook_author = "ichunyun"
# facebook_publisher = "ichunyun"
# og_locale = "en_US"

## JSON-LD
[extra.schema]
type = "Person"
logo = "favicon-32x32.png"
linked_in = ""
github = "https://git.tqwewe.com/tqwewe"
section = "blog"                     # see config.extra.main~url
## Sitelinks Search Box
site_links_search_box = false

